<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subjects - AdaptEd Admin</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body data-module="categories">
  <div class="admin-layout">
    <aside class="sidebar"><div class="brand"><div class="brand-icon">A</div><div><h1>AdaptEd Admin</h1><p>Control Center</p></div></div><nav id="adminNav" class="nav-list"></nav></aside>
    <main class="main">
      <div class="topbar"><div><h2 id="pageTitle" class="page-title"></h2><p class="muted">Maintain Subject → Chapter → Subtopic hierarchy and ordering.</p></div><div class="row"><span id="adminIdentity" class="badge"></span><button id="logoutBtn">Logout</button></div></div>

      <section>
        <article class="card">
          <h3>Add Category Node</h3>
          <form id="catForm" class="grid" style="margin-top:10px">
            <input id="subjName" placeholder="Subject" required />
            <input id="chapterName" placeholder="Chapter" required />
            <input id="subtopicName" placeholder="Subtopic" required />
            <button class="btn-primary" type="submit">Add</button>
          </form>
        </article>
      </section>

      <section class="card" style="margin-top:14px">
        <table><thead><tr><th>Subject</th><th>Chapter</th><th>Subtopic</th><th>Action</th></tr></thead><tbody id="catRows"></tbody></table>
      </section>
    </main>
  </div>
  <script src="admin.js"></script>
</body>
</html>
