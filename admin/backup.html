<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Backup - AdaptEd Admin</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" /><link rel="stylesheet" href="admin.css" /></head>
<body data-module="backup"><div class="admin-layout"><aside class="sidebar"><div class="brand"><div class="brand-icon">A</div><div><h1>AdaptEd Admin</h1><p>Control Center</p></div></div><nav id="adminNav" class="nav-list"></nav></aside><main class="main"><div class="topbar"><div><h2 id="pageTitle" class="page-title"></h2><p class="muted">Backup all content/summaries and restore previous data snapshots.</p></div><div class="row"><span id="adminIdentity" class="badge"></span><button id="logoutBtn">Logout</button></div></div>
<section class="grid cols-2"><article class="card"><h3>Backup Controls</h3><p class="small muted">Last backup: <span id="backupWhen">-</span></p><button id="createBackup" class="btn-primary">Create Backup</button><label style="margin-top:10px;display:block">Restore backup file<input id="restoreBackup" type="file" accept="application/json" /></label></article><article class="card"><h3>Storage Usage</h3><p id="storageUsed"></p><div class="progress"><span id="storageBar"></span></div></article></section>
</main></div><script src="admin.js"></script></body></html>
