<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Feedback - AdaptEd Admin</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" /><link rel="stylesheet" href="admin.css" /></head>
<body data-module="feedback"><div class="admin-layout"><aside class="sidebar"><div class="brand"><div class="brand-icon">A</div><div><h1>AdaptEd Admin</h1><p>Control Center</p></div></div><nav id="adminNav" class="nav-list"></nav></aside><main class="main"><div class="topbar"><div><h2 id="pageTitle" class="page-title"></h2><p class="muted">Ratings, comments and prompt-improvement loop.</p></div><div class="row"><span id="adminIdentity" class="badge"></span><button id="logoutBtn">Logout</button></div></div>
<section class="grid cols-2"><article class="card"><div class="kicker">Average Rating</div><div id="avgRating" class="metric">0</div><button id="updatePrompt" class="btn-primary">Improve AI Prompt from Feedback</button></article><article class="card"><h3>Poorly Performing Summaries</h3><ul id="weakSummaryList"></ul></article></section>
<section class="card" style="margin-top:14px"><h3>Feedback Stream</h3><table><thead><tr><th>Summary</th><th>Rating</th><th>Comment</th></tr></thead><tbody id="feedbackRows"></tbody></table></section>
</main></div><script src="admin.js"></script></body></html>
