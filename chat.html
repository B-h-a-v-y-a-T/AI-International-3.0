    <style>
        /* Chat-specific layout */
        .chat-layout {
            display: grid;
            grid-template-columns: 1fr;
            height: 100vh;
            overflow: hidden;
        }

        .chat-main {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .chat-header {
            background: var(--grad-lavender);
            padding: 16px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chat-header h2 {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .chat-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            margin-top: 2px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .chat-footer {
            padding: 12px 18px 18px;
            border-top: 1px solid var(--border);
            background: var(--bg-card);
            flex-shrink: 0;
        }

        .emotion-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .emotion-pill {
            padding: 5px 13px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1.5px solid;
            transition: var(--transition);
            background: transparent;
        }

        .emotion-pill:hover {
            transform: translateY(-1px);
        }

        .ep-confident {
            color: #10B981;
            border-color: rgba(16, 185, 129, 0.4);
        }

        .ep-confident.active {
            background: rgba(16, 185, 129, 0.15);
        }

        .ep-confused {
            color: #D97706;
            border-color: rgba(217, 119, 6, 0.4);
        }

        .ep-confused.active {
            background: rgba(217, 119, 6, 0.12);
        }

        .ep-frustrated {
            color: #EF4444;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .ep-frustrated.active {
            background: rgba(239, 68, 68, 0.12);
        }

        .ep-anxious {
            color: #7C3AED;
            border-color: rgba(124, 58, 237, 0.4);
        }

        .ep-anxious.active {
            background: rgba(124, 58, 237, 0.12);
        }

        .ep-neutral {
            color: #64748B;
            border-color: rgba(100, 116, 139, 0.4);
        }

        .ep-neutral.active {
            background: rgba(100, 116, 139, 0.12);
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 13px 18px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-full);
            background: var(--bg-input);
            font-size: 14px;
            color: var(--text-primary);
            transition: var(--transition);
            resize: none;
            height: 48px;
            line-height: 22px;
        }

        .chat-input:focus {
            border-color: var(--primary);
            background: var(--bg-card);
            
            outline: none;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--grad-primary);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: white;
            font-size: 18px;
            
        }

        .send-btn:hover {
            transform: scale(1.08);
        }

        .lang-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            font-size: 12px;
            cursor: pointer;
            background: var(--bg-input);
            color: var(--text-secondary);
        }

        .bubble-wrapper {
            display: flex;
            flex-direction: column;
        }

        .bubble-wrapper.user {
            align-items: flex-end;
        }

        .bubble-wrapper.ai {
            align-items: flex-start;
        }

        /* Video Recommendations */
        .video-recommendations {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 100%;
        }

        .video-rec-header {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .video-rec-card {
            display: flex;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 10px;
            cursor: pointer;
            transition: var(--transition);
            max-width: 500px;
        }

        .video-rec-card:hover {
            border-color: var(--primary);
            transform: translateX(4px);
            
        }

        .video-rec-thumb {
            width: 120px;
            height: 68px;
            border-radius: var(--radius-md);
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .video-rec-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-rec-play {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
        }

        .video-rec-play svg {
            width: 24px;
            height: 24px;
            color: white;
            opacity: 0.9;
        }

        .video-rec-info {
            flex: 1;
            min-width: 0;
        }

        .video-rec-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-rec-channel {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
    
        /* New Chat Aesthetics */
        .chat-main {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            flex: 1;
            margin-left: 0;
            background: 
                radial-gradient(circle at 50% 0%, #FFFFFF 0%, #FFFFFF 20%, transparent 60%),
                radial-gradient(circle at 100% 60%, rgba(124, 58, 237, 0.4) 0%, transparent 70%),
                radial-gradient(circle at 0% 100%, rgba(249, 115, 22, 0.45) 0%, transparent 70%),
                #F8FAFC;
            background-size: cover;
            position: relative;
            transition: background 0.3s ease;
        }
        @media(max-width: 900px) {
            .chat-main { margin-left: 0; }
        }

        .chat-hero {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.5s cubic-bezier(0.2, 0.9, 0.2, 1);
            padding: 0 20px;
        }

        .chat-hero.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -60%);
        }

        .chat-hero h1 {
            font-size: 38px;
            font-weight: 800;
            color: #1E293B;
            margin-bottom: 28px;
            text-align: center;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }

        .chat-input-container {
            width: 100%;
            max-width: 640px;
            background: #F4F0E8;
            border-radius: 30px;
            border: 2px solid var(--border);
            box-shadow: 2px 2px 0px var(--border);
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            transition: all 0.5s cubic-bezier(0.2, 0.9, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .chat-input-container.docked {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(244, 240, 232, 0.85);
            backdrop-filter: blur(10px);
        }

        .chat-input-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .chat-input-row button.icon-btn {
            background: none;
            border: none;
            color: #64748B;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .chat-input-row button.icon-btn:hover {
            background: rgba(0,0,0,0.05);
            color: #1E293B;
        }

        .chat-input-row input {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 16px;
            color: #1E293B;
            padding: 8px 0;
            outline: none;
            font-family: inherit;
        }

        .chat-input-row input::placeholder {
            color: #94A3B8;
        }

        .chat-input-row .send-pill {
            background: #94A3B8;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chat-input-row input:not(:placeholder-shown) ~ div .send-pill {
            background: #3B82F6;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 80px max(10%, 20px) 120px; 
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .chat-messages.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .bubble-wrapper { display: flex; flex-direction: column; }
        .bubble-wrapper.user { align-items: flex-end; }
        .bubble-wrapper.ai { align-items: flex-start; }
        .bubble-wrapper.ai.with-mascot {
            flex-direction: row;
            align-items: flex-end;
            gap: 10px;
            max-width: 92%;
            animation: aiBubbleIn 260ms ease-out;
            transform-origin: left bottom;
        }

        .ai-mascot-avatar {
            width: 46px;
            height: 46px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(241,245,249,0.94));
            border: 1px solid rgba(148,163,184,0.32);
            box-shadow: 0 4px 12px rgba(15,23,42,0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .ai-mascot-avatar svg {
            width: 30px;
            height: 30px;
            filter: drop-shadow(0 2px 4px rgba(255,122,31,0.2));
        }

        .bubble-wrapper.ai.with-mascot .chat-bubble.ai {
            max-width: min(78ch, calc(100% - 56px));
        }

        @keyframes aiBubbleIn {
            0% { opacity: 0; transform: translateY(8px) scale(0.985); }
            70% { opacity: 1; transform: translateY(-1px) scale(1.01); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .chat-bubble {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            
            position: relative;
        }
        
        .chat-bubble.user {
            background: #F3F4F6;
            color: #1E293B;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }
        
        .chat-bubble.ai {
            background: white;
            color: #1E293B;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .top-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px 32px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 30;
            pointer-events: none;
        }
        .top-nav > * { pointer-events: auto; }
        
        .video-rec-card { background: white !important; }

    </style>
</head>

    <script>
        const API = '';  // Use relative URLs
        let currentEmotion = 'Neutral';
        let isMicActive = false;
        let chatHistory = [];
        let isSending = false;

        function selectEmotion(name, btn) {
            currentEmotion = name;
            document.querySelectorAll('.emotion-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            setEmotion(name);
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        
        function updateDynamicHeaderBadges(emoBadge, riskLevel, reasonStr) {
            let hdr = document.querySelector('.chat-header p');
            if(!hdr) return;
            
            let rColor = "#10B981"; // Low = green
            if(riskLevel === "MEDIUM") rColor = "#F59E0B"; 
            if(riskLevel === "HIGH") rColor = "#EF4444"; 

            hdr.innerHTML = `Emotion: <span style="font-weight:bold;margin-right:10px">${emoBadge}</span> Risk: <span style="font-weight:bold;color:${rColor};cursor:help" title="${reasonStr}">${riskLevel}</span>`;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg || isSending) return;
            isSending = true;

            appendBubble(msg, 'user');
            chatHistory.push({ role: 'user', text: msg });
            input.value = '';
            showTyping();

                        try {
                // Check if user is asking for a study plan
                if (window.AgentTutor && AgentTutor.isStudyPlanRequest(msg)) {
                    const agentDecision = await AgentTutor.getDecision('chat');
                    removeTyping();
                    const planText = AgentTutor.formatStudyPlan(agentDecision);
                    appendBubble(planText, 'ai');
                    chatHistory.push({ role: 'assistant', text: planText });
                    playVoice(planText);
                    isSending = false;
                    return;
                }
                // Call dynamic ai backend
                const analyzeRes = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: msg, language: window.I18n ? I18n.getGeminiLang() : 'English' })
                });
                if (!analyzeRes.ok) throw new Error('Analyze API error');
                const data = await analyzeRes.json();
                
                removeTyping();

                const aiResponseText = data.reply || 'Got it!';
                appendBubble(aiResponseText, 'ai');
                chatHistory.push({ role: 'assistant', text: aiResponseText });
                playVoice(aiResponseText);

                
            } catch (err) {
                removeTyping();
                appendBubble('Sorry, I couldn\'t connect right now. Please check if the backend server is running.', 'ai');
                console.error(err);
            } finally {
                isSending = false;
            }
        }

        function appendBubble(text, who) {
            const msgs = document.getElementById('chatMessages');
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const wrapper = document.createElement('div');
            wrapper.className = `bubble-wrapper ${who}`;
            wrapper.innerHTML = `<div class="chat-bubble ${who}">${formatText(text)}<div class="bubble-time">${now}</div></div>`;
            msgs.appendChild(wrapper);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function formatText(t) {
            return t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
        }

        function appendVideos(videos, introText = '') {
            const msgs = document.getElementById('chatMessages');
            const wrapper = document.createElement('div');
            wrapper.className = 'bubble-wrapper ai';
            wrapper.innerHTML = `
                <div class="video-recommendations">
                    <div class="video-rec-header">
                        <i data-lucide="video" style="width:14px;height:14px"></i>
                        Recommended Videos
                    </div>
                    ${introText ? `<div style="font-size:12px;line-height:1.45;color:var(--text-secondary);margin-bottom:10px;">${formatText(introText)}</div>` : ''}
                    ${videos.map(v => `
                        <div class="video-rec-card" onclick="openChatVideoModal('${v.videoUrl}', '${v.title.replace(/'/g, "&#39;").replace(/"/g, "&quot;")}')">
                            <div class="video-rec-thumb">
                                <img src="${v.thumbnail}" alt="${v.title}">
                                <div class="video-rec-play">
                                    <svg viewBox="0 0 24 24" fill="white" stroke="none">
                                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                    </svg>
                                </div>
                            </div>
                            <div class="video-rec-info">
                                <div class="video-rec-title">${v.title}</div>
                                <div class="video-rec-channel">
                                    <i data-lucide="user" style="width:10px;height:10px"></i>
                                    ${v.channel}
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            msgs.appendChild(wrapper);
            msgs.scrollTop = msgs.scrollHeight;
            if (window.lucide) lucide.createIcons();
        }

        function openChatVideoModal(videoUrl, title) {
            let videoId = null;
            try {
                const parsedUrl = new URL(videoUrl);
                if (parsedUrl.hostname.includes('youtu.be')) {
                    videoId = parsedUrl.pathname.replace(/^\//, '').trim();
                } else {
                    videoId = parsedUrl.searchParams.get('v');
                }
            } catch (err) {
                videoId = null;
            }

            // Fallback cards may point to a YouTube search URL instead of a direct watch URL.
            if (!videoId) {
                window.open(videoUrl, '_blank', 'noopener,noreferrer');
                return;
            }

            const modal = document.createElement('div');
            modal.id = 'chatVideoModal';
            modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.2s ease';
            modal.innerHTML = `
                <div style="background:var(--bg-card);border-radius:var(--radius-xl);width:100%;max-width:1000px;max-height:90vh;overflow:hidden;box-shadow: 2px 2px 0px var(--border);animation:scaleIn 0.3s ease">
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)">
                        <h3 style="font-size:16px;font-weight:700;color:var(--text-primary);margin:0;flex:1;padding-right:16px">${title}</h3>
                        <button onclick="document.getElementById('chatVideoModal').remove()" style="width:32px;height:32px;border-radius:50%;background:var(--bg-secondary);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition)">
                            <i data-lucide="x" style="width:18px;height:18px"></i>
                        </button>
                    </div>
                    <div style="padding:0;position:relative;padding-bottom:56.25%;height:0;overflow:hidden">
                        <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:none"></iframe>
                    </div>
                </div>
            `;
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';
            if (window.lucide) lucide.createIcons();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('chatVideoModal')) {
                document.getElementById('chatVideoModal').remove();
                document.body.style.overflow = '';
            }
        });

        function showTyping() {
            const msgs = document.getElementById('chatMessages');
            const wrapper = document.createElement('div');
            wrapper.className = 'bubble-wrapper ai';
            wrapper.id = 'typingWrapper';
            wrapper.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            msgs.appendChild(wrapper);
            msgs.scrollTop = msgs.scrollHeight;
        }
        function removeTyping() {
            document.getElementById('typingWrapper')?.remove();
        }

        function toggleMic() {
            const btn = document.getElementById('micBtn');
            isMicActive = !isMicActive;
            btn.classList.toggle('recording', isMicActive);
            if (isMicActive) {
                // Use Web Speech API if available
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const recognition = new SpeechRecognition();
                    recognition.lang = (typeof I18n !== 'undefined') ? ({ en: 'en-IN', hi: 'hi-IN', mr: 'mr-IN', gu: 'gu-IN' }[I18n.currentLang] || 'en-IN') : 'en-IN';
                    recognition.interimResults = false;
                    recognition.onresult = (e) => {
                        const text = e.results[0][0].transcript;
                        document.getElementById('chatInput').value = text;
                        Toast.show(typeof I18n !== 'undefined' ? I18n.t('chat.voice_got_it') : 'Got it! Tap send to ask.', 'success');
                        btn.classList.remove('recording');
                        isMicActive = false;
                    };
                    recognition.onerror = () => {
                        Toast.show(typeof I18n !== 'undefined' ? I18n.t('chat.voice_error') : 'Could not hear you. Try again.', 'error');
                        btn.classList.remove('recording');
                        isMicActive = false;
                    };
                    recognition.onend = () => {
                        btn.classList.remove('recording');
                        isMicActive = false;
                    };
                    recognition.start();
                    Toast.show(typeof I18n !== 'undefined' ? I18n.t('chat.voice_on') : 'Listening... 🎤 Speak now!', 'info');
                } else {
                    Toast.show(typeof I18n !== 'undefined' ? I18n.t('chat.voice_unsupported') : 'Voice not supported in this browser', 'error');
                    btn.classList.remove('recording');
                    isMicActive = false;
                }
            }
        }
    </script>
    <script>if (window.lucide) lucide.createIcons();</script>

    <script>
        // --- NEW CHAT LOGIC UI OVERRIDES ---
        let hasStartedChat = false;

        async function hydrateChatHistory() {
            if (!window.ChatbotAgent || typeof window.ChatbotAgent.getRecentHistory !== 'function') return;
            try {
                const recent = await window.ChatbotAgent.getRecentHistory(20);
                if (Array.isArray(recent) && recent.length) {
                    chatHistory = recent;
                }
            } catch (e) {
                console.warn('[Chat] Failed to hydrate chat history from Data Agent:', e);
            }
        }
        
        function initChatHero() {
            // Text animation is handled centrally by multilingual-chat.js
            
            // Sync typing in hero input to activate send button
            let heroInp = document.getElementById('chatInputHero');
            let dockedInp = document.getElementById('chatInputDocked');
            
            if(heroInp && dockedInp) {
                heroInp.addEventListener('input', (e) => {
                    const btn = heroInp.parentElement.querySelector('.send-pill');
                    if(e.target.value.trim().length > 0) btn.style.background = '#3B82F6';
                    else btn.style.background = '#94A3B8';
                });
                dockedInp.addEventListener('input', (e) => {
                    const btn = dockedInp.parentElement.querySelector('.send-pill');
                    if(e.target.value.trim().length > 0) btn.style.background = '#3B82F6';
                    else btn.style.background = '#94A3B8';
                });
            }
        }
        
        window.addEventListener('DOMContentLoaded', async () => {
            initChatHero();
            await hydrateChatHistory();
        });

        // --- MOOD DYNAMIC BACKGROUND ---
        function updateChatBackground(mood) {
            const chatMain = document.getElementById('chatMain');
            if(!chatMain) return;
            const m = (mood || '').toLowerCase();
            
            if (m.includes('angry') || m.includes('frustrated')) {
                // Blue tone for angry
                chatMain.style.background = 'radial-gradient(circle at 50% 0%, #FFFFFF 0%, #FFFFFF 30%, transparent 80%), radial-gradient(circle at 100% 60%, rgba(59, 130, 246, 0.25) 0%, transparent 60%), radial-gradient(circle at 0% 100%, rgba(37, 99, 235, 0.2) 0%, transparent 60%), #eff6ff';
            } else if (m.includes('sad') || m.includes('anxious') || m.includes('depressed')) {
                // Green tone for sad
                chatMain.style.background = 'radial-gradient(circle at 50% 0%, #FFFFFF 0%, #FFFFFF 30%, transparent 80%), radial-gradient(circle at 100% 60%, rgba(34, 197, 94, 0.2) 0%, transparent 60%), radial-gradient(circle at 0% 100%, rgba(22, 163, 74, 0.2) 0%, transparent 60%), #f0fdf4';
            } else {
                // Default / happy / neutral
                if (hasStartedChat) {
                    chatMain.style.background = 'radial-gradient(circle at 50% 0%, #FFFFFF 0%, #FFFFFF 30%, transparent 80%), radial-gradient(circle at 100% 60%, rgba(124, 58, 237, 0.2) 0%, transparent 60%), radial-gradient(circle at 0% 100%, rgba(249, 115, 22, 0.2) 0%, transparent 60%), #F8FAFC';
                } else {
                    chatMain.style.background = 'radial-gradient(circle at 50% 0%, #FFFFFF 0%, #FFFFFF 20%, transparent 60%), radial-gradient(circle at 100% 60%, rgba(124, 58, 237, 0.4) 0%, transparent 70%), radial-gradient(circle at 0% 100%, rgba(249, 115, 22, 0.45) 0%, transparent 70%), #F8FAFC';
                }
            }
        }

        function transitionToChat() {
            if(hasStartedChat) return;
            hasStartedChat = true;
            document.getElementById('chatHero').classList.add('hidden');
            document.getElementById('chatMessages').classList.add('visible');
            
            document.getElementById('dockedInputContainer').style.opacity = '1';
            document.getElementById('dockedInputContainer').style.pointerEvents = 'auto';
            
            // Initial background based on current emotion
            updateChatBackground(currentEmotion);
            
            document.getElementById('chatInputDocked').focus();
        }

        function handleKeyHero(e) { if (e.key === 'Enter') sendMessageHero(); }
        function handleKeyDocked(e) { if (e.key === 'Enter') sendMessageDocked(); }

        async function sendMessageHero() {
            const val = document.getElementById('chatInputHero').value.trim();
            if(!val) return;
            document.getElementById('chatInputDocked').value = val;
            transitionToChat();
            await processSendProxy(val);
        }
        
        async function sendMessageDocked() {
            const val = document.getElementById('chatInputDocked').value.trim();
            if(!val) return;
            await processSendProxy(val);
        }

        async function processSendProxy(msg) {
            if(isSending) return;
            isSending = true;
            
            let btn = document.getElementById('chatInputDocked').parentElement.querySelector('.send-pill');
            btn.style.background = '#94A3B8';
            
            document.getElementById('chatInputDocked').value = '';
            document.getElementById('chatInputHero').value = '';
            
            appendBubble(msg, 'user');
            chatHistory.push({ role: 'user', text: msg });

            if (window.ChatbotAgent && typeof window.ChatbotAgent.recordUserMessage === 'function') {
                await window.ChatbotAgent.recordUserMessage(msg, { emotion: currentEmotion });
            }

            showTyping();

            try {
                // Check if user is asking for a study plan (agent integration)
                if (window.AgentTutor && AgentTutor.isStudyPlanRequest(msg)) {
                    const agentDecision = await AgentTutor.getDecision('chat');
                    removeTyping();
                    const planText = AgentTutor.formatStudyPlan(agentDecision);
                    appendBubble(planText, 'ai');
                    chatHistory.push({ role: 'assistant', text: planText });
                    playVoice(planText);
                    isSending = false;
                    return;
                }

                // Extract user state for personalization
                let userState = null;
                if (window.AgentTutor) {
                    userState = AgentTutor.getUserState();
                }

                // Extract VectorDB RAG context
                let ragContext = null;
                if (window.VectorDB) {
                    try {
                        const similarQs = VectorDB.getQuestionsForTopic(msg, 2);
                        if (similarQs && similarQs.length > 0) {
                            ragContext = similarQs.map(q => q.question + " (Topic: " + q.topic + ")").join(' | ');
                        }
                    } catch(e) { console.error('VectorDB error:', e); }
                }

                const basePayload = {
                    language: window.I18n ? I18n.getGeminiLang() : 'English',
                    history: chatHistory.slice(-10),
                    userState: userState,
                    ragContext: ragContext
                };

                const requestPayload = (window.ChatbotAgent && typeof window.ChatbotAgent.buildPayload === 'function')
                    ? await window.ChatbotAgent.buildPayload(msg, basePayload)
                    : { message: msg, ...basePayload };

                const analyzeRes = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestPayload)
                });
                if (!analyzeRes.ok) throw new Error('API error: ' + analyzeRes.status);
                const data = await analyzeRes.json();
                
                removeTyping();

                const aiResponseText = data.reply || 'Got it!';
                appendBubble(aiResponseText, 'ai');
                chatHistory.push({ role: 'assistant', text: aiResponseText });
                playVoice(aiResponseText);

                if (window.ChatbotAgent && typeof window.ChatbotAgent.recordExchange === 'function') {
                    await window.ChatbotAgent.recordExchange(msg, aiResponseText, {
                        emotion: data.emotion || (data.debug && data.debug.mood) || currentEmotion,
                        weakConcepts: (data.debug && data.debug.weak_concepts) || []
                    });
                }

                // Show debug info as collapsible detail card
                if (data.debug) {
                    const d = data.debug;
                    const debugHtml = '<details style="font-size:12px; opacity:0.7; cursor:pointer; margin-top:4px;">' +
                        '<summary style="font-weight:600; color:#6366F1;">🔍 Tutor Details</summary>' +
                        '<div style="margin-top:6px; padding:8px 12px; background:rgba(99,102,241,0.06); border-radius:10px; font-size:11px; line-height:1.6;">' +
                        '<b>Intent:</b> ' + (d.intent || 'N/A') + ' &nbsp;|&nbsp; <b>Action:</b> ' + (d.decided_action || d.selected_action) + ' &nbsp;|&nbsp; <b>Variation:</b> ' + (d.variation || 'N/A') + '<br>' +
                        '<b>Mood:</b> ' + d.mood + ' (conf=' + (d.mood_confidence || 0).toFixed(3) + ', raw=' + (d.mood_raw_label || 'N/A') + ') &nbsp;|&nbsp; <b>Videos:</b> ' + (d.allow_videos ? '✅' : '🚫') + '<br>' +
                        '<b>Reward:</b> ' + d.reward + ' &nbsp;|&nbsp; <b>Difficulty:</b> ' + d.difficulty + ' &nbsp;|&nbsp; <b>Topic:</b> ' + (d.target_concept || 'N/A') + '<br>' +
                        '<b>Weak concepts:</b> ' + ((d.weak_concepts || []).join(', ') || 'None') + '<br>' +
                        (d.mood_reason ? '<b>Mood reason:</b> ' + d.mood_reason + '<br>' : '') +
                        (d.reasoning ? '<b>Reasoning:</b> ' + d.reasoning : '') +
                        '</div></details>';
                    const msgs = document.getElementById('chatMessages');
                    const dw = document.createElement('div');
                    dw.className = 'bubble-wrapper ai';
                    dw.innerHTML = '<div style="max-width:80%;">' + debugHtml + '</div>';
                    msgs.appendChild(dw);
                    msgs.scrollTop = msgs.scrollHeight;
                }

                // Update emotion badge and background
                let em = data.emotion;
                if (!em && data.debug && data.debug.mood) {
                    em = data.debug.mood;
                }
                if (em && typeof setEmotion === 'function') {
                    currentEmotion = em;
                    setEmotion(em);
                    updateChatBackground(em);
                }

                // Show video recommendations (limit to 3)
                if (data.videos && data.videos.length > 0) {
                    const limitedVideos = data.videos.slice(0, 3);
                    appendVideos(limitedVideos, data.videoIntro || '');
                }

            } catch (err) {
                removeTyping();
                appendBubble('Sorry, I couldn\'t connect right now. Please check if the backend server is running.', 'ai');
                console.error('Chat error:', err);
            } finally {
                isSending = false;
            }
        }
        
        // Ensure appendBubble uses new style
        function getTutorMascotAvatarMarkup() {
            return `<div class="ai-mascot-avatar" aria-hidden="true">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="bot-mascot-mini" focusable="false">
                    <ellipse cx="50" cy="18" rx="14" ry="11" fill="#FF7A1F"/>
                    <circle cx="21" cy="72" r="8" fill="#FF7A1F"/>
                    <circle cx="79" cy="72" r="8" fill="#FF7A1F"/>
                    <ellipse cx="50" cy="54" rx="36" ry="32" fill="#FF7A1F"/>
                    <rect x="16" y="42" width="16" height="24" rx="8" fill="#FF7A1F" stroke="#1E1B4B" stroke-width="2.5"/>
                    <rect x="68" y="42" width="16" height="24" rx="8" fill="#FF7A1F" stroke="#1E1B4B" stroke-width="2.5"/>
                    <rect x="24" y="36" width="52" height="42" rx="16" fill="#1E1B4B"/>
                    <path d="M 52 38 L 49 44 L 53 44 L 50 49" stroke="#FFD700" stroke-width="2" fill="none" stroke-linejoin="miter" stroke-linecap="square"/>
                    <circle cx="41" cy="56" r="5.5" fill="#FFFFFF"/>

                </svg>
            </div>`;
        }

        function appendBubble(text, who) {
            const msgs = document.getElementById('chatMessages');
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const wrapper = document.createElement('div');
            wrapper.className = `bubble-wrapper ${who}`;
            const safeText = (typeof formatText === 'function') ? formatText(text) : text;

            if (who === 'ai') {
                wrapper.classList.add('with-mascot');
                wrapper.innerHTML = `${getTutorMascotAvatarMarkup()}<div class="chat-bubble ${who}">${safeText}<div class="bubble-time" style="font-size:11px; opacity:0.6; margin-top:8px; text-align:right;">${now}</div></div>`;
            } else {
                wrapper.innerHTML = `<div class="chat-bubble ${who}">${safeText}<div class="bubble-time" style="font-size:11px; opacity:0.6; margin-top:8px; text-align:right;">${now}</div></div>`;
            }

            msgs.appendChild(wrapper);
            msgs.scrollTop = msgs.scrollHeight;
        }

        // VOICE CAPABILITIES
        let isVoiceEnabled = true;
        let synth = window.speechSynthesis;
        let activeRecognition = null;
        let isListening = false;

        function toggleSpeaker() {
            isVoiceEnabled = !isVoiceEnabled;
            const icons = document.querySelectorAll('.speaker-icon');
            icons.forEach(icon => {
                if(isVoiceEnabled) {
                    icon.setAttribute('data-lucide', 'volume-2');
                    icon.style.color = '#3B82F6';
                } else {
                    icon.setAttribute('data-lucide', 'volume-x');
                    icon.style.color = '#64748B';
                }
            });
            if(window.lucide) lucide.createIcons();
            if(!isVoiceEnabled && synth) {
                synth.cancel();
            }
        }

        function playVoice(text) {
            if(!isVoiceEnabled || !synth) return;
            synth.cancel(); // Stop ongoing speech
            
            // Clean markdown and HTML for speech
            const cleanText = text.replace(/\*\*(.*?)\*\*/g, '$1')
                                  .replace(/\*(.*?)\*/g, '$1')
                                  .replace(/<[^>]*>?/gm, '');
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            // utterance.lang = 'en-US'; // Use system default optionally
            synth.speak(utterance);
        }

        function toggleRealMic(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);

            if (isListening && activeRecognition) {
                activeRecognition.stop();
                return;
            }

            if(synth) synth.cancel(); // Stop AI speaking when user starts mic

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Your browser doesn't support the Web Speech API");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            activeRecognition = new SpeechRecognition();
            activeRecognition.interimResults = true;

            activeRecognition.onstart = () => {
                isListening = true;
                btn.style.color = '#EF4444'; // Red active mic
                input.dataset.originalPlaceholder = input.placeholder;
                input.placeholder = "Listening...";
                input.value = "";
            };

            activeRecognition.onresult = (e) => {
                let transcript = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    transcript += e.results[i][0].transcript;
                }
                input.value = transcript;
                
                if(transcript.trim().length > 0) {
                    const sendBtn = input.parentElement.querySelector('.send-pill');
                    if(sendBtn) sendBtn.style.background = '#3B82F6';
                }
            };

            activeRecognition.onend = () => {
                isListening = false;
                btn.style.color = '';
                if(input.dataset.originalPlaceholder) {
                    input.placeholder = input.dataset.originalPlaceholder;
                }
                activeRecognition = null;
            };

            activeRecognition.onerror = (e) => {
                console.error("Speech reco error", e);
                isListening = false;
                btn.style.color = '';
                if(input.dataset.originalPlaceholder) {
                    input.placeholder = input.dataset.originalPlaceholder;
                }
            };

            activeRecognition.start();
        }

        function toggleMicHero() { toggleRealMic('chatInputHero', 'micBtnHero'); }
        function toggleMicDocked() { toggleRealMic('chatInputDocked', 'micBtnDocked'); }
    </script>
