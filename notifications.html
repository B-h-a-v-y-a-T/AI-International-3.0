<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Announcements - AdaptEd Admin</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" /><link rel="stylesheet" href="admin.css" /></head>
<body data-module="notifications"><div class="admin-layout"><aside class="sidebar"><div class="brand"><div class="brand-icon">A</div><div><h1>AdaptEd Admin</h1><p>Control Center</p></div></div><nav id="adminNav" class="nav-list"></nav></aside><main class="main"><div class="topbar"><div><h2 id="pageTitle" class="page-title"></h2><p class="muted">Broadcast announcements and update alerts.</p></div><div class="row"><span id="adminIdentity" class="badge"></span><button id="logoutBtn">Logout</button></div></div>
<section><article class="card"><h3>Send Notification</h3><form id="noticeForm" class="grid"><input id="noticeTitle" placeholder="Announcement title" required /><textarea id="noticeBody" rows="5" placeholder="Message" required></textarea><select id="noticeAudience"><option value="all">All users</option><option value="students">Students</option><option value="premium">Premium</option></select><button class="btn-primary" type="submit">Send</button></form></article></section>
<section class="card" style="margin-top:14px"><table><thead><tr><th>Title</th><th>Audience</th><th>Time</th><th>Message</th></tr></thead><tbody id="noticeRows"></tbody></table></section>
</main></div><script src="admin.js"></script></body></html>
